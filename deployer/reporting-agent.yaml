apiVersion: apps/v1
kind: Deployment
metadata:
  name: briefcms-2-reporting-agent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: briefcms-reporting-agent
  template:
    metadata:
      labels:
        app: briefcms-reporting-agent
    spec:
      serviceAccountName: default
      containers:
      - name: ubbagent
        image: gcr.io/cloud-marketplace-tools/metering/ubbagent:latest
        env:
        - name: AGENT_CONFIG_FILE
          value: /etc/ubbagent/config.yaml
        - name: AGENT_LOCAL_PORT
          value: "4567"
        - name: AGENT_STATE_DIR
          value: /var/lib/ubbagent
        - name: AGENT_REPORT_DIR
          value: /var/lib/ubbagent/reports
        - name: AGENT_CONSUMER_ID
          valueFrom:
            secretKeyRef:
              name: $reportingSecret
              key: consumer-id  
        volumeMounts:
        - name: ubbagent-config
          mountPath: /etc/ubbagent
        - name: ubbagent-state
          mountPath: /var/lib/ubbagent
      volumes:
      - name: ubbagent-config
        configMap:
          name: briefcms-1-ubbagent-config
      - name: ubbagent-state
        emptyDir: {}