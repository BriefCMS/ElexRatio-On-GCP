apiVersion: v1
kind: ConfigMap
metadata:
  name: briefcms-1-ubbagent-config
  namespace: default
data:
  config.yaml: |
    identities:
    - name: gcp
      gcp:
        encodedServiceAccountKey: 
    
    metrics:
    - name: user
      type: int
      endpoints:
      - name: servicecontrol
      aggregation:
        bufferSeconds: 60
    
    endpoints:
    - name: servicecontrol
      servicecontrol:
        identity: gcp
        serviceName: briefcms.endpoints.able-decorator-477323-u6.cloud.goog
        consumerId: $AGENT_CONSUMER_ID